<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Def-Blogs</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <h1>Def-Blogs</h1>
      <div style="float: right; margin-top: -50px">
        <button id="add-btn" type="button">Add Blog</button>
        <button id="edit-btn" type="button">Edit Blog</button>
        <button id="delete-btn" type="button">Delete Blog</button>
      </div>
    </header>

    <hr />

    <section id="form-section" class="hidden">
      <h2 id="form-heading">Add a New Blog</h2>
      <form id="blog-form">
        <input id="blog-id" type="hidden" />
        <label for="title">Title</label>
        <input id="title" type="text" required />
        <label for="content">Content</label>
        <textarea id="content" rows="5" required></textarea>
        <button type="submit">Save Blog</button>
      </form>
    </section>

    <div id="blog-container"></div>
    <script src="script.js"></script>
  </body>
</html>
